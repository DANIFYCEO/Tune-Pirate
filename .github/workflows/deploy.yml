name: Build and Push Backend Container

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Log in to GitHub Container Registry using automatic token
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Log in to Azure Container Registry (if ACR_PASSWORD secret is configured)
      - name: Log in to Azure Container Registry
        if: ${{ secrets.ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: tunepiratecr.azurecr.io
          username: tunepiratecr
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Build and push
      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/danifyceo/tunepirate-backend:latest
            ${{ secrets.ACR_PASSWORD != '' && 'tunepiratecr.azurecr.io/tunepirate-backend:latest' || '' }}
